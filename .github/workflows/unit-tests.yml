name: unit-tests

on:
  push:
    branches: [main]
    paths: ["Codes/src/**", "Codes/ci/**", ".github/workflows/unit-tests.yml"]
  pull_request:
    paths: ["Codes/src/**", "Codes/ci/**", ".github/workflows/unit-tests.yml"]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Ubuntu 22.04 / Python 3.10 as ROS 2 Humble; no ROS: the ROS-dependent tests skip
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Codes/ci/requirements-test.txt

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r Codes/ci/requirements-test.txt
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright and Chromium (operator page test)
        run: |
          npm install -g playwright@1.47.2
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          npx -y playwright@1.47.2 install --with-deps chromium

      - name: Unit tests
        run: Codes/ci/run_unit_tests.sh
