# MoveIt octomap from the RealSense point cloud (quickstart.launch.py octomap:=true).
# The raw cloud is always shown in RViz; this only decides whether MoveIt also
# turns it into collision voxels for planning.
sensors:
  - realsense_cloud
realsense_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 1.5
  point_subsample: 2
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 5.0
  filtered_cloud_topic: /move_group/filtered_cloud
