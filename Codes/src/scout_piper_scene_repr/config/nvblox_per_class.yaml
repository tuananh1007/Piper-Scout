# Per-class nvblox tuning. Each class gets its own nvblox_ros node instance
# (Phase 1 v0). launch/nvblox_semantic.launch.py maps these keys onto nvblox_ros
# parameters on top of nvblox_base.yaml + realsense_nvblox.yaml:
#   voxel_size_m               -> voxel_size
#   max_integration_distance_m -> static_mapper.projective_integrator_max_integration_distance_m
#   weighting                  -> static_mapper.projective_integrator_weighting_mode
#                                 (passed through unchanged; only
#                                  "inverse_square_tsdf_distance_penalty" has been validated, in
#                                  realsense_nvblox.yaml; confirm the values below on the first run)
# Any other key is rejected at launch.

stem:
  voxel_size_m: 0.003                  # 3 mm — recover thin stems
  max_integration_distance_m: 0.8
  weighting: constant
branch:
  voxel_size_m: 0.005
  max_integration_distance_m: 1.0
  weighting: constant
leaf:
  voxel_size_m: 0.010
  max_integration_distance_m: 1.0
  weighting: inverse_square
target:
  voxel_size_m: 0.003
  max_integration_distance_m: 0.5
  weighting: constant
