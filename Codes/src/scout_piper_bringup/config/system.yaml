# scout_piper_bringup/config/system.yaml
#
# Top-level system parameters consumed by full_system.launch.py.
# Mirrors the argument names of the ROS 1 stem_grasp_ros1.launch where possible
# so existing tuning carries over.

/**:
  ros__parameters:
    use_sim_time: false

# ----------------------------------------------------------------------------
# Arm (Piper) — CAN interface + control rates
# ----------------------------------------------------------------------------
piper_driver:
  ros__parameters:
    can_interface: "can0"          # Set with `find_all_can_port.sh`
    auto_enable: true
    # Conservative defaults; matches startup_zero_* args in ROS 1 launch.
    default_joint_speed: 20
    default_pose_speed: 20
    startup_zero_speed: 12
    startup_zero_duration_sec: 12.0
    go_zero_speed: 12
    zero_joint_threshold_rad: 0.08

# ----------------------------------------------------------------------------
# Scout base — CAN interface
# ----------------------------------------------------------------------------
scout_driver:
  ros__parameters:
    port_name: "can1"              # Distinct from Piper to avoid bus contention
    odom_frame: "odom"
    base_frame: "base_link"
    simulated_robot: false

# ----------------------------------------------------------------------------
# Stem-grasp pipeline (ports the dense ROS 1 launch arguments)
# ----------------------------------------------------------------------------
stem_grasp_pipeline:
  ros__parameters:
    # --- Loop rates ---
    outer_loop_hz: 5.0
    inner_loop_hz: 100.0

    # --- Frames ---
    planning_frame: "piper_base_link"
    eef_frame: "piper_link6"
    camera_optical_frame: "camera_color_optical_frame"
    move_group: "arm"

    # --- Segmentation ---
    mask_mode: "yolo_seg"
    enable_depth_prefilter: false
    enable_depth_postfilter: true
    segmentation_min_depth_m: 0.05
    segmentation_max_depth_m: 1.20
    text_prompt: "branch"
    target_caption: "leaf"
    target_min_pixels: 30
    instance_selection_mode: "highest_conf"
    selection_frame: "base_link"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    min_valid_depth_pixels: 50

    # --- YOLO ---
    yolo_model_path: "/home/sciarm/models/yolo26n-seg.pt"
    yolo_conf: 0.15
    yolo_iou: 0.45
    yolo_stem_class_id: 58           # COCO potted plant
    yolo_imgsz: 960
    yolo_mask_threshold: 0.25

    # --- Mask post ---
    mask_dilate_kernel: 3
    mask_dilate_iterations: 1

    # --- Grounding ---
    enable_vesselness_fusion: false
    vessel_sigma_min: 1.0
    vessel_sigma_max: 2.0
    vessel_sigma_step: 0.5
    vessel_threshold: 0.1
    vessel_roi_dilate_px: 100
    vessel_downsample: 2
    enable_context_prompt: false
    context_prompt_fallback_to_base: true

    # --- Iterative approach (P0.4.13, stem_grasp/approach.py) ---
    # After the reach handoff: servo, then advance along the gripper axis in
    # approach_step steps, re-aligning (image error <= approach_align_tolerance_px
    # for approach_settle_sec) between steps, until the grasp point is within
    # approach_distance_tolerance or contact_threshold_n is felt. Aborts when the
    # TCP starts farther than approach_target_distance, after approach_max_steps,
    # without a stem mask (>= approach_min_leaf_pixels) for approach_mask_wait_sec,
    # or after approach_timeout_sec. approach_goal_orientation_tolerance (a ROS 1
    # MoveIt tolerance) is unused. Off by default: it moves the gripper onto the
    # stem, and the Piper has no force sensor for contact_threshold_n.
    approach_enabled: false
    approach_target_distance: 0.25
    approach_step: 0.05
    approach_max_steps: 8
    approach_settle_sec: 0.4
    approach_distance_tolerance: 0.01
    approach_mask_wait_sec: 2.0
    approach_min_leaf_pixels: 60
    approach_goal_orientation_tolerance: 0.05
    approach_speed_mps: 0.02
    approach_align_tolerance_px: 8.0
    approach_timeout_sec: 60.0

    # --- Skeleton stability ---
    skeleton_min_stem_points: 6
    skeleton_max_endpoint_jump_m: 0.05
    skeleton_cache_max_age_sec: 2.0

    # --- Planning (Phase 0: still MoveIt 2 OMPL; Phase 3 replaces with cuMotion) ---
    goal_position_tolerance: 0.01
    goal_orientation_tolerance: 0.35
    target_position_offset_m: 0.12
    velocity_scale: 0.12
    acceleration_scale: 0.12
    grasp_strategy: "nearest_target"
    target_point_timeout_sec: 3.5

    # --- Multi-view capture (kept off by default in Phase 0) ---
    enable_autonomous_viewpoint_capture: false
    capture_ring_views: 8
    capture_ring_arc_deg: 160.0
    capture_min_viewpoint_separation_deg: 20.0

    # --- Force / safety ---
    max_force_n: 2.0
    contact_threshold_n: 0.15

    # --- Servo (Phase 0: routes to moveit_servo; Phase 2 replaces with MPPI-VS) ---
    servo_cmd_topic: "/servo_node/delta_twist_cmds"
    # Image-based servo (P0.4.12). The target must appear where the gripper
    # approach axis (eef_frame z, TCP tcp_offset_m along it) crosses its depth;
    # the stem position is read from the mask rows around the target's row.
    # The gain is lambda_inf + (lambda_0 - lambda_inf) exp(-rho e_px), scaled
    # down within 0.25 m of the stem; above ~10 px it is lambda_inf. moveit_servo
    # realises ~55 % of a commanded velocity, so 0.5 converges 60 -> 4 px in
    # ~15 s hardware-free (ROS 1 used 0.07: ~4x slower). Tune on the robot.
    tcp_offset_m: 0.14
    servo_lambda_0: 0.8
    servo_lambda_inf: 0.5
    servo_rho: 0.3
    servo_row_band_px: 12
    target_point_max_age_sec: 0.5
    servo_mask_max_age_sec: 0.3
    # Move to the pre-grasp pose (P0.4.11): "none" only publishes
    # /stem_grasp/target_pose; "whole_body_mpc" sends it to the whole-body MPC
    # (run it with execute:=true and bringup_servo:=true), waits for "reached",
    # cancels the MPC and starts the image-based servo (INSTALL.md 10.9).
    reach_executor: "none"
    mpc_world_frame: "odom"
    mpc_goal_pose_topic: "/whole_body_mpc/goal_pose"
    mpc_status_topic: "/whole_body_mpc/status"
    mpc_cancel_topic: "/whole_body_mpc/cancel"
    reach_timeout_sec: 60.0
    reach_settle_sec: 1.0
