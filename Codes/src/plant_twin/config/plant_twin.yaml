plant_twin:
  ros__parameters:
    planning_frame: "piper_base_link"
    fingertip_frame: "piper_link7"
    # From stem_grasp/pointcloud_node (xyz + packed rgb, in its output_frame)
    leaf_cloud_topic: "/stem_grasp/leaf_filtered_cloud"
    stem_cloud_topic: "/stem_grasp/filtered_cloud"
    # From stem_grasp/segmentation_node; outline + holes are read off this mask
    mask_topic: "/stem_grasp/target_mask"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    contact_threshold_n: 0.15      # same as stem_grasp pipeline
    gripper_closed_m: 0.01         # piper_joint7 < this => grasped => pull allowed
    rate_hz: 10.0
    stem_ctrl_points: 6
    stem_radius_m: 0.003
    color_topic: "/camera/color/image_raw"   # baked into the UV texture
    reinit_min_iou: 0.6            # mesh silhouette vs mask; below it for reinit_frames
    reinit_frames: 5               #   frames in a row without contact: re-initialise
    texture_size: 256              # texels per side
    texture_every_n: 3             # bake every n-th frame
    export_dir: "/tmp/plant_twin"  # ~/export writes OBJ + MTL + PNG here
    leaf_backend: "numpy"          # "torch": leaf residual + Jacobian on `device` (leaf_torch.py)
    device: "cpu"                  # e.g. "cuda" on the Orin
