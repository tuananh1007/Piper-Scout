plant_twin:
  ros__parameters:
    planning_frame: "piper_base_link"
    fingertip_frame: "piper_link7"
    # From stem_grasp/pointcloud_node (xyz + packed rgb, in its output_frame)
    leaf_cloud_topic: "/stem_grasp/leaf_filtered_cloud"
    stem_cloud_topic: "/stem_grasp/filtered_cloud"
    # From stem_grasp/segmentation_node; outline + holes are read off this mask
    mask_topic: "/stem_grasp/target_mask"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    contact_threshold_n: 0.15      # same as stem_grasp pipeline
    gripper_closed_m: 0.01         # piper_joint7 < this => grasped => pull allowed
    rate_hz: 10.0
    stem_ctrl_points: 6
    stem_radius_m: 0.003
