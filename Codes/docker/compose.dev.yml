# Dev compose for the Piper+Scout ROS 2 Humble workspace.
# Usage:
#   cd Codes
#   ./docker/build_dev.sh
#   docker compose -f docker/compose.dev.yml run --rm dev
#
# Inside the container:
#   ./scripts/colcon_build_safe.sh --symlink-install
#   ros2 launch scout_piper_description view_robot.launch.py

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: piper-scout-dev:humble
    container_name: piper-scout-dev
    network_mode: host
    ipc: host
    # Cap the container's memory so a runaway build or node is killed inside
    # it instead of swapping the whole host into a freeze. 12g suits a 16 GB
    # workstation; raise it on bigger machines (DEV_MEM_LIMIT=24g ...).
    # memswap_limit = mem_limit: the container gets no swap.
    mem_limit: ${DEV_MEM_LIMIT:-12g}
    memswap_limit: ${DEV_MEM_LIMIT:-12g}
    privileged: true
    runtime: nvidia                # requires nvidia-container-toolkit on host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    volumes:
      - ..:/workspace                                                # workspace bind-mount
      - /tmp/.X11-unix:/tmp/.X11-unix:rw                             # X11 for RViz
      - /dev/dri:/dev/dri                                            # GPU passthrough
      - ${HOME}/.Xauthority:/home/dev/.Xauthority:ro                 # X auth
      - /dev/bus/usb:/dev/bus/usb                                    # RealSense USB
      - /sys/class/net:/sys/class/net                                # CAN ifaces visible
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: /bin/bash
