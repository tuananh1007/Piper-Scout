repositories:
  piper_ros:
    type: git
    url: https://github.com/agilexrobotics/piper_ros.git
    version: humble
  scout_ros2:
    type: git
    url: https://github.com/agilexrobotics/scout_ros2.git
    version: humble
  ugv_sdk:
    type: git
    url: https://github.com/westonrobot/ugv_sdk.git
    version: main
  scout_nav2:
    type: git
    url: https://github.com/AIRLab-POLIMI/scout_nav2.git
    version: main
  # Hand-eye (AX=XB) calibration RViz plugin, used by piper_quickstart's
  # calibrate:=true mode. No Humble release exists: the ros2 branch was ROS 1
  # code until this Jazzy port (Nov 2025). Pinned to that commit;
  # patch_upstream.sh maps its Jazzy header names back to Humble's.
  moveit_calibration:
    type: git
    url: https://github.com/moveit/moveit_calibration.git
    version: 3f9d48ebe843caf1de060bfafe78160585c7c26f
  # realsense-ros is NOT pulled from source: the dev image installs
  # ros-humble-realsense2-camera from apt, built against the matching apt
  # librealsense2. A source copy would shadow it and must track the SDK version.

  # ---- NVIDIA Isaac ROS (Phase 1: nvblox semantic SDF) ----
  # Source builds because the apt repo dropped jammy/Humble in Q4 2025.
  # Tags `release-3.2` are the last Humble-targeted ones; the nvblox CUDA
  # library is vendored as a submodule under nvblox_ros/nvblox_core
  # (pinned to nvblox v0.0.7 by upstream). After `vcs import`, run
  # `./scripts/patch_upstream.sh` to init that submodule.
  isaac_ros_common:
    type: git
    url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common.git
    version: release-3.2
  isaac_ros_nvblox:
    type: git
    url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nvblox.git
    version: release-3.2
  # NITROS = NVIDIA's zero-copy GPU transport for ROS 2. nvblox_ros uses it
  # for the depth/color image input pipeline (see nvblox_node.hpp).
  isaac_ros_nitros:
    type: git
    url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros.git
    version: release-3.2
  # The NVIDIA Graph Execution Framework. Note: the package is named
  # `isaac_ros_gxf` (and CMake's find_package looks for that), but the
  # REPO is just `gxf`. The package.xml inside declares the right name.
  isaac_ros_gxf:
    type: git
    url: https://github.com/NVIDIA-ISAAC-ROS/gxf.git
    version: release-3.2
  # ROS topic-format negotiation library — pulled in by isaac_ros_nitros's
  # nitros_format_agent for selecting compatible publishers/subscribers.
  negotiated:
    type: git
    url: https://github.com/osrf/negotiated.git
    version: master
